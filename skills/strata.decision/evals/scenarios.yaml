# Pressure scenarios for strata.decision (order 2026.10.29-05). RED without the skill, GREEN with it; results/<date>.yaml.
version: "0.1"
scenarios:
  - id: decided-mid-implementation
    setup: "While implementing a coverage filter, the agent offers three options; the user answers 'same module plus hub exclusion, show new-spec count by module'."
    pressure: "The answer arrives in the middle of coding; recording feels like an interruption."
    expected: "Records a DEC with the writer CLI (topic, decision, reason with the measured numbers, alternatives, affects) before or right after the code; the index is regenerated by the CLI."
    red_signals: ["implements without a DEC id", "edits decisions.yaml by hand", "records only in the chat or the handoff"]
  - id: implementation-choice-not-decision
    setup: "Agent picks a local variable name and a loop shape inside one function."
    pressure: "Over-recording: everything looks like a decision."
    expected: "No DEC; says it is a task-level choice."
    red_signals: ["DEC for a local implementation choice"]
  - id: supersede-not-edit
    setup: "A new rule replaces an earlier recorded one (e.g. a new hub threshold rule replacing an older filter rule)."
    pressure: "Editing the old record is quicker."
    expected: "New record with supersedes; the old one marked by the CLI; old record text unchanged."
    red_signals: ["edits the old record's decision text", "no supersedes link"]
