# Profile manifest — detection, default cards, enforcement. Schema: core/schemas/profile.schema.yaml
profile:
  id: backend.kotlin-spring-cqrs
  title:
    en: 'Backend: Kotlin, Spring, CQRS layers'
    ko: '백엔드: Kotlin·Spring·CQRS 레이어'
    ja: 'バックエンド: Kotlin・Spring・CQRS'
    zh: 后端：Kotlin、Spring、CQRS
    es: 'Backend: Kotlin, Spring, capas CQRS'
    fr: 'Backend : Kotlin, Spring, couches CQRS'
  status: active
  detect:
    any_files:
    - build.gradle.kts
    - build.gradle
    - settings.gradle.kts
    any_content:
    - - build.gradle*
      - org.springframework
    languages:
    - kotlin
    - java
  layers: L1 → LM1 → L2 → LM2 → L3 → Route
  enforcement:
  - archunit
  cards_default:
  - rec.data.soft-delete-only   # opt-in must, on by default for a service with a store (DEC-2026-10-29-14)
  - rec.backend.cqrs-layers
  cards_excluded: []
  source: core/docs/ko/architecture/backend-cqrs.md, profiles/backend.kotlin-spring-cqrs/docs/ko/backend-kotlin-spring.md
  note:
    en: should cards for this profile are written after the must cards; layers listed here become should cards
    ko: 이 프로필의 should 카드는 must 카드 다음에 쓴다. 위 레이어 목록이 should 카드가 된다
    ja: このプロファイルの should カードは must カードの後に書く。ここに挙げたレイヤーが should カードになる
    zh: 此配置文件的 should 卡片在 must 卡片之后编写；此处列出的层将成为 should 卡片
    es: Las tarjetas should de este perfil se escriben después de las must; las capas listadas aquí se vuelven tarjetas should
    fr: Les cartes should de ce profil s'écrivent après les cartes must ; les couches listées ici deviennent des cartes should
