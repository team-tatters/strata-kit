# Profile manifest — detection, default cards, enforcement. Schema: core/schemas/profile.schema.yaml
profile:
  id: backend.go-service
  title:
    en: Backend service in Go
    ko: Go 백엔드 서비스
    ja: Go のバックエンドサービス
    zh: Go 后端服务
    es: Servicio backend en Go
    fr: Service backend en Go
  status: draft
  detect:
    any_files:
    - go.mod
    languages:
    - go
  layers: feature packages (internal/<domain>) with role files — store.go (L2 data access), command.go·query.go (L2 services), usecase.go (L3), http.go (Route)
  enforcement:
  - depguard
  - go vet
  - staticcheck
  - go test ./...
  cards_default: [rec.data.soft-delete-only]   # opt-in must, on by default for a service with a store (DEC-2026-10-29-14)
  cards_excluded: []
  source: core/docs/ko/architecture/backend-cqrs.md, profiles/backend.go-service/docs/ko/backend-go.md (DEC-2026-10-29-06)
  note:
    en: should cards for this profile are written after the must cards; layers listed here become should cards
    ko: 이 프로필의 should 카드는 must 카드 다음에 쓴다. 위 레이어 목록이 should 카드가 된다
    ja: このプロファイルの should カードは must カードの後に書く。ここに挙げたレイヤーが should カードになる
    zh: 此配置文件的 should 卡片在 must 卡片之后编写；此处列出的层将成为 should 卡片
    es: Las tarjetas should de este perfil se escriben después de las must; las capas listadas aquí se vuelven tarjetas should
    fr: Les cartes should de ce profil s'écrivent après les cartes must ; les couches listées ici deviennent des cartes should
