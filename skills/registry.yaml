# Skill registry — the routing table `using-strata` reads (DEC-2026-10-28-03 in strata).
# Layering: this core registry is read first, then profiles/<id>/skills/registry.yaml,
# then the project's .strata/kit/registry.yaml (generated) and Tier P skills/registry.yaml (skill packs).
# What may follow each skill (next:) lives beside this file in next.yaml (DEC-2026-11-01-15): routing reads only this
# file at session start, `kb skills next` reads both.
# Later layers may add routes and
# override earlier ones by `skill` name. `using-strata` itself never changes.
version: '0.1'
