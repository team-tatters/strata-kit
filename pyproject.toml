[project]
name = "strata-kit"
version = "0.1.0"
description = "Strata methodology kit — recommendation cards, profiles, skills, the guidance wizard and the KB engine (store · search · MCP server)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "n0roo" }]
dependencies = [
    "pyyaml>=6.0",
    "numpy>=1.26",
    "mcp>=1.27.0",
]

[project.optional-dependencies]
embed = [
    "sentence-transformers>=3.0",
    "torch>=2.2",
]

[project.scripts]
strata-kb-mcp = "kb.mcp:main"
strata-kb = "kb.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kb"]
